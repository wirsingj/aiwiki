services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: "8080"
      AIWIKI_MODEL_PROVIDER: "${AIWIKI_MODEL_PROVIDER:-ollama}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.1}"
      OLLAMA_WORKER_BASE_URLS: "${OLLAMA_WORKER_BASE_URLS:-}"
      AIWIKI_GENERATION_MODE: "${AIWIKI_GENERATION_MODE:-pipeline}"
      AIWIKI_GENERATION_CONCURRENCY: "${AIWIKI_GENERATION_CONCURRENCY:-2}"
      HOSTED_MODEL_BASE_URL: "${HOSTED_MODEL_BASE_URL:-https://api.openai.com/v1}"
      HOSTED_MODEL_NAME: "${HOSTED_MODEL_NAME:-gpt-4o-mini}"
      HOSTED_MODEL_API_KEY: "${HOSTED_MODEL_API_KEY:-}"
      HOSTED_MODEL_JSON_MODE: "${HOSTED_MODEL_JSON_MODE:-true}"
      HOSTED_MODEL_TIMEOUT_SECONDS: "${HOSTED_MODEL_TIMEOUT_SECONDS:-90}"
      HOSTED_MODEL_HTTP_REFERER: "${HOSTED_MODEL_HTTP_REFERER:-}"
      HOSTED_MODEL_APP_TITLE: "${HOSTED_MODEL_APP_TITLE:-AIWIKI}"
      AIWIKI_ALLOWED_ORIGINS: "${AIWIKI_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}"
      AIWIKI_RATE_LIMIT_PER_MINUTE: "${AIWIKI_RATE_LIMIT_PER_MINUTE:-12}"
      AIWIKI_RATE_LIMIT_BURST: "${AIWIKI_RATE_LIMIT_BURST:-4}"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_UPSTREAM: "http://backend:8080"
      AIWIKI_API_BASE_URL: ""
      PORT: "80"
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_started
